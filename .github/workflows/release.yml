name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    container:
      image: node:22-bookworm-slim
      options: --security-opt=no-new-privileges
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.archive.outputs.tag }}
    env:
      # Keep opt-in tests away from any database/model configuration on the runner.
      EVIDENCEKG_TEST_DSN: ''
      EVIDENCEKG_APP_TEST_ADMIN_CONFIG: ''
      EVIDENCEKG_APP_TEST_PYTHON: ''
      EVIDENCEKG_APP_TEST_MODELS: ''
    steps:
      - name: Install parser prerequisites
        shell: bash
        run: |
          if ! command -v apt-get >/dev/null; then
            echo '::error::The build runner must provide apt-get (Debian/Ubuntu).'
            exit 1
          fi
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git poppler-utils tesseract-ocr tesseract-ocr-eng libseccomp2
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - name: Select release version
        id: version
        uses: actions/github-script@v7
        env:
          RELEASE_SERIES: ${{ vars.RELEASE_SERIES }}
          BUILD_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const {selectVersion} = require('./scripts/release_version.cjs');
            const base = require('./product/ui/package.json').version;
            const selected = selectVersion({base, series: process.env.RELEASE_SERIES,
              number: process.env.BUILD_NUMBER});
            core.setOutput('version', selected.version);
            core.setOutput('tag', selected.tag);
            core.info(`Selected ${selected.tag}`);
      - name: Synchronize build version
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python scripts/set_release_version.py "$BUILD_VERSION"
      - name: Install Python dependencies
        run: uv sync --project evidencekg --frozen --extra app
      - name: Check parser prerequisites
        run: |
          command -v pdftoppm
          tesseract --list-langs | grep -Fx eng
          uv run --project evidencekg --frozen --extra app python -c 'import ctypes; ctypes.CDLL("libseccomp.so.2")'
      - name: Test Python
        run: uv run --project evidencekg --frozen --extra app python -m pytest evidencekg/tests product/tests -q --tb=short
      - name: Test and build dashboard
        working-directory: product/ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Test release publication
        run: node --test scripts/*.test.cjs
      - name: Build release archive
        id: archive
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/docworm-release.XXXXXX")
          tag="$RELEASE_TAG"
          uv run --project evidencekg --frozen --extra app python scripts/build_release.py --output "$output" --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cd "$output"
          sha256sum --check ./*.tar.gz.sha256
          echo "RELEASE_OUTPUT=$output" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ env.RELEASE_OUTPUT }}/*.tar.gz
            ${{ env.RELEASE_OUTPUT }}/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish release candidate
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish_candidate.cjs');
            await publish({github, context, core});
